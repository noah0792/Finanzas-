<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1d22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanzas C$">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mis Finanzas C$</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💰%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f3f4f7;--card:#fff;--field:#eceef2;--text:#1b1d22;--mut:#6b7280;--acc:#2f7df6;--inc:#16a34a;--exp:#e5484d;--tr:#8b5cf6;--line:#dde0e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d22;--card:#25272d;--field:#1a1c20;--text:#f1f2f4;--mut:#9aa0ab;--line:#33363d;--inc:#4ade80;--exp:#ff6b6f}}
:root[data-theme="dark"]{--bg:#1b1d22;--card:#25272d;--field:#1a1c20;--text:#f1f2f4;--mut:#9aa0ab;--line:#33363d;--inc:#4ade80;--exp:#ff6b6f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:15px;font-weight:600;color:var(--mut);margin:4px 0 2px}
.bal{font-size:38px;font-weight:700;letter-spacing:-.02em;margin:0 0 12px}
.sum{display:flex;gap:10px;margin-bottom:14px}
.sum div{flex:1;background:var(--card);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--mut)}
.sum b{display:block;font-size:17px;color:var(--text)}
.wal{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.wal div{flex:0 0 auto;background:var(--card);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--mut)}
.wal b{display:block;font-size:15px;color:var(--text)}
.card{background:var(--card);border-radius:18px;padding:14px 16px 18px;margin-bottom:18px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:-4px -4px 12px}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:600 15px inherit;padding:10px 0;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--text);border-color:var(--acc)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input,select,textarea{width:100%;background:var(--field);border:1px solid transparent;border-radius:12px;color:var(--text);font:16px inherit;padding:13px 14px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.save{width:100%;margin-top:18px;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:14px;font:700 16px inherit;cursor:pointer}
.err{color:var(--exp);font-size:13px;min-height:18px;margin-top:8px}
h2{font-size:17px;margin:0 0 10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.mid{flex:1;min-width:0}.mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{color:var(--mut)}
.amt{font-weight:700;white-space:nowrap}
.del{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer;padding:4px 6px}
.empty{color:var(--mut);text-align:center;padding:18px 0}
.add{display:flex;gap:8px;margin-top:6px}.add button{flex:0 0 auto;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:0 16px;font-weight:600}
.tip{font-size:13px;color:var(--mut);text-align:center;margin-top:20px}
</style>
</head>
<body>
<main>
<h1>Saldo total</h1>
<p class="bal" id="bal">C$ 0.00</p>
<div class="sum"><div>Ingresos del mes<b id="si" style="color:var(--inc)">C$ 0</b></div><div>Gastos del mes<b id="se" style="color:var(--exp)">C$ 0</b></div></div>
<div class="wal" id="wal"></div>

<section class="card">
<div class="tabs" role="tablist" id="tabs">
<button role="tab" data-t="ingreso">Ingresos</button><button role="tab" data-t="gasto" aria-selected="true">Gastos</button><button role="tab" data-t="transf">Transferencia</button>
</div>
<label for="fecha">Fecha</label><input type="datetime-local" id="fecha">
<label for="monto">Importe (C$)</label><input type="number" id="monto" inputmode="decimal" min="0" step="0.01" placeholder="C$ 0">
<div id="gDesc"><label for="desc">Descripción</label><input id="desc" maxlength="80" placeholder="Breve descripción"></div>
<div id="gCat"><label for="cat">Categoría</label><select id="cat"></select></div>
<label for="wallet" id="lw">Billetera</label><select id="wallet"></select>
<div id="gTo" hidden><label for="to">A la billetera</label><select id="to"></select></div>
<label for="nota">Nota</label><input id="nota" maxlength="200" placeholder="Escribir una nota">
<div class="err" id="err" role="alert"></div>
<button class="save" id="save">Guardar</button>
</section>

<h2>Movimientos</h2>
<div id="list"></div>

<section class="card" style="margin-top:18px">
<h2>Billeteras</h2>
<div class="add"><input id="nw" maxlength="24" placeholder="Nueva billetera (ej. BAC, Lafise)"><button id="addw">Agregar</button></div>
</section>
<section class="card">
<h2>Respaldo</h2>
<div class="add"><button id="bk">Copiar respaldo</button></div>
<textarea id="bkt" rows="3" placeholder="Para restaurar, pega aquí el respaldo" style="margin-top:10px"></textarea>
<div class="add"><button id="rs">Restaurar</button></div>
<div class="err" id="bkm" style="color:var(--mut)"></div>
</section>
</main>
<script>
var CATS={
 gasto:[["Utilidades","💡"],["Ropa","👕"],["Educación","🎓"],["Entretenimiento","🎲"],["Aptitud","🏋️"],["Comida","🍴"],["Regalo","🎁"],["Belleza","💄"],["Casa","🛋️"],["Mascota","🐶"],["Compras","🛒"],["Transporte","🚌"],["Viajar","🧳"],["Otros","⚪"]],
 ingreso:[["Reembolsos","🪙"],["Premios","🏅"],["Subsidios","💰"],["Dividendos","📈"],["Inversiones","🔄"],["Lotería","🎰"],["Salario","💵"],["Cupones","🎟️"],["Otros","⚪"]]
};
var KEY="finanzas-c$-v1",S=null,tab="gasto";
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S||!S.wallets)S={wallets:[{id:"w1",name:"Efectivo"},{id:"w2",name:"Banco"},{id:"w3",name:"Tarjeta"}],tx:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function fm(n,d){return "C$ "+n.toLocaleString("es-NI",{minimumFractionDigits:d===undefined?2:d,maximumFractionDigits:d===undefined?2:d})}
function nowLocal(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function wname(id){var w=S.wallets.filter(function(x){return x.id===id})[0];return w?w.name:"—"}
function fill(){
 var opts=S.wallets.map(function(w){return '<option value="'+w.id+'">'+esc(w.name)+'</option>'}).join("");
 $("wallet").innerHTML=opts;$("to").innerHTML=opts;if(S.wallets[1])$("to").value=S.wallets[1].id;
 setCats()}
function setCats(){var c=CATS[tab]||[];$("cat").innerHTML='<option value="">Selecciona categoría</option>'+c.map(function(x){return '<option>'+x[0]+'</option>'}).join("")}
function setTab(t){tab=t;
 [].forEach.call($("tabs").children,function(b){b.setAttribute("aria-selected",b.dataset.t===t)});
 var tr=t==="transf";$("gCat").hidden=tr;$("gTo").hidden=!tr;$("lw").textContent=tr?"De la billetera":"Billetera";
 $("gDesc").hidden=false;setCats();$("err").textContent=""}
function balances(){var b={};S.wallets.forEach(function(w){b[w.id]=0});
 S.tx.forEach(function(t){var a=t.amount;
  if(t.type==="ingreso")b[t.wallet]=(b[t.wallet]||0)+a;
  else if(t.type==="gasto")b[t.wallet]=(b[t.wallet]||0)-a;
  else{b[t.wallet]=(b[t.wallet]||0)-a;b[t.to]=(b[t.to]||0)+a}});return b}
function render(){
 var b=balances(),tot=0;
 $("wal").innerHTML=S.wallets.map(function(w){tot+=b[w.id]||0;return '<div>'+esc(w.name)+'<b>'+fm(b[w.id]||0)+'</b></div>'}).join("");
 $("bal").textContent=fm(tot);
 var m=new Date().toISOString().slice(0,7),i=0,e=0;
 S.tx.forEach(function(t){if(t.date.slice(0,7)===m){if(t.type==="ingreso")i+=t.amount;if(t.type==="gasto")e+=t.amount}});
 $("si").textContent=fm(i,0);$("se").textContent=fm(e,0);
 var L=S.tx.slice().sort(function(a,b){return a.date<b.date?1:-1});
 if(!L.length){$("list").innerHTML='<div class="empty">Aún no hay movimientos. Registra tu primer gasto arriba.</div>';return}
 $("list").innerHTML=L.map(function(t){
  var ic="🔁",col="var(--tr)",sg="",nm=t.desc||"Transferencia",sub=wname(t.wallet);
  if(t.type==="transf"){sub=wname(t.wallet)+" a "+wname(t.to)}
  else{var f=(CATS[t.type]||[]).filter(function(x){return x[0]===t.cat})[0];ic=f?f[1]:"⚪";nm=t.desc||t.cat||"Sin descripción";sub=(t.cat?t.cat+" · ":"")+wname(t.wallet);
   col=t.type==="ingreso"?"var(--inc)":"var(--exp)";sg=t.type==="ingreso"?"+":"−"}
  var d=new Date(t.date).toLocaleDateString("es-NI",{day:"numeric",month:"short"});
  return '<div class="item"><div class="dot" style="background:color-mix(in srgb,'+col+' 18%,transparent)">'+ic+'</div><div class="mid"><b>'+esc(nm)+'</b><small>'+esc(sub)+" · "+d+'</small></div><div class="amt" style="color:'+col+'">'+sg+fm(t.amount)+'</div><button class="del" data-id="'+t.id+'" aria-label="Eliminar">✕</button></div>'}).join("")}
$("tabs").onclick=function(e){if(e.target.dataset.t)setTab(e.target.dataset.t)};
$("save").onclick=function(){
 var a=parseFloat($("monto").value),er=$("err");
 if(!(a>0)){er.textContent="Escribe un importe mayor a C$ 0.";return}
 var t={id:"t"+Date.now(),type:tab,date:$("fecha").value||nowLocal(),amount:a,desc:$("desc").value.trim(),cat:$("cat").value,wallet:$("wallet").value,to:$("to").value,note:$("nota").value.trim()};
 if(tab==="transf"&&t.wallet===t.to){er.textContent="Elige dos billeteras distintas.";return}
 if(tab!=="transf"&&!t.cat){er.textContent="Selecciona una categoría.";return}
 S.tx.push(t);save();render();
 $("monto").value="";$("desc").value="";$("nota").value="";$("cat").value="";$("fecha").value=nowLocal();er.textContent=""};
$("list").onclick=function(e){var id=e.target.dataset.id;if(!id)return;S.tx=S.tx.filter(function(t){return t.id!==id});save();render()};
$("addw").onclick=function(){var n=$("nw").value.trim();if(!n)return;S.wallets.push({id:"w"+Date.now(),name:n});$("nw").value="";save();fill();render()};
$("bk").onclick=function(){var j=JSON.stringify(S);$("bkt").value=j;$("bkt").select();try{navigator.clipboard.writeText(j).then(function(){$("bkm").textContent="Respaldo copiado. Pégalo en Notas para guardarlo."},function(){$("bkm").textContent="Selecciona el texto y cópialo manualmente."})}catch(e){$("bkm").textContent="Selecciona el texto y cópialo manualmente."}};
$("rs").onclick=function(){try{var d=JSON.parse($("bkt").value);if(!d.wallets||!d.tx)throw 0;S=d;save();fill();render();$("bkm").textContent="Datos restaurados."}catch(e){$("bkm").textContent="El respaldo no es válido."}};
try{var c=document.createElement("canvas");c.width=c.height=180;var x=c.getContext("2d");x.fillStyle="#2f7df6";x.fillRect(0,0,180,180);x.fillStyle="#fff";x.font="bold 84px system-ui,sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText("C$",90,95);var l=document.createElement("link");l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");document.head.appendChild(l)}catch(e){}
load();$("fecha").value=nowLocal();fill();render();
</script>
</body>
</html>
